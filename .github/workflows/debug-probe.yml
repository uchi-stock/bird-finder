name: debug-probe
on:
  push:
    branches: ['claude/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: AWS鍵の登録状況と権限（値は表示しない）
        env:
          S_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          V_KEY: ${{ vars.AWS_ACCESS_KEY_ID }}
          V_SEC: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          S_REG: ${{ secrets.AWS_REGION }}
          V_REG: ${{ vars.AWS_REGION }}
        run: |
          st() { if [ -n "$1" ]; then echo "設定あり"; else echo "なし"; fi; }
          echo "secrets.AWS_ACCESS_KEY_ID     : $(st "$S_KEY")"
          echo "secrets.AWS_SECRET_ACCESS_KEY : $(st "$S_SEC")"
          echo "vars.AWS_ACCESS_KEY_ID        : $(st "$V_KEY")"
          echo "vars.AWS_SECRET_ACCESS_KEY    : $(st "$V_SEC")"
          echo "secrets.AWS_REGION            : $(st "$S_REG")"
          echo "vars.AWS_REGION               : $(st "$V_REG")"
          export AWS_ACCESS_KEY_ID="${S_KEY:-$V_KEY}"
          export AWS_SECRET_ACCESS_KEY="${S_SEC:-$V_SEC}"
          export AWS_DEFAULT_REGION="${S_REG:-${V_REG:-ap-northeast-1}}"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then echo "鍵が見つからないため、権限の確認は省略"; exit 0; fi
          echo "リージョン: $AWS_DEFAULT_REGION"
          if out=$(aws sts get-caller-identity --output json 2>&1); then
            arn=$(echo "$out" | python3 -c "import sys,json;print(json.load(sys.stdin)['Arn'])")
            kind=$(echo "$arn" | sed -E 's/^arn:aws:iam::[0-9]+:(.*)$/\1/' | cut -d/ -f1)
            echo "鍵の有効性: 有効（種類: $kind）"
          else
            echo "鍵の有効性: 無効または拒否 → $(echo "$out" | head -c 160)"
          fi
          chk() { if aws "$@" >/dev/null 2>/tmp/e.txt; then echo "  許可: $1 $2"; else echo "  拒否: $1 $2 ($(grep -oE '(AccessDenied|UnauthorizedOperation|not authorized)[A-Za-z]*' /tmp/e.txt | head -1))"; fi; }
          echo "必要な操作の確認（読み取りのみ）:"
          chk cloudformation list-stacks --max-items 1
          chk lambda list-functions --max-items 1
          chk dynamodb list-tables --max-items 1
          chk apigateway get-rest-apis --limit 1
          chk iam list-roles --max-items 1
          chk s3api list-buckets
          chk logs describe-log-groups --limit 1
