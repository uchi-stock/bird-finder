name: debug-probe
on:
  push:
    branches: ['claude/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass
        run: |
          Q='[out:json][timeout:15];(
          nwr(around:200,35.6400,139.5500)["natural"~"^(water|wetland|wood|grassland|scrub|heath)$"];
          nwr(around:200,35.6400,139.5500)["waterway"~"^(river|riverbank|stream|canal)$"];
          nwr(around:200,35.6400,139.5500)["landuse"~"^(residential|commercial|retail|industrial|forest|farmland|meadow|grass|orchard|vineyard)$"];
          nwr(around:200,35.6400,139.5500)["leisure"~"^(park|garden|nature_reserve)$"];
          way(around:200,35.6400,139.5500)["building"];
          );out tags qt 300;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            echo "== $ep"
            curl -s -m 30 -o /tmp/o.txt -w "status=%{http_code} time=%{time_total}\n" -H "Origin: https://uchi-stock.github.io" -D /tmp/h.txt --data-urlencode "data=$Q" "$ep"
            grep -i "access-control" /tmp/h.txt || echo "no CORS header"
            head -c 300 /tmp/o.txt; echo
          done
      - name: Wikimedia thumb sizes
        run: |
          J=$(curl -s "https://ja.wikipedia.org/api/rest_v1/page/summary/%E3%82%B9%E3%82%BA%E3%83%A1")
          T=$(echo "$J" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['thumbnail']['source']);print(d.get('originalimage',{}).get('source'))")
          echo "$T"
          U=$(echo "$T" | head -1)
          for w in 320 500 800 960; do
            V=$(echo "$U" | sed -E "s#/[0-9]+px-#/${w}px-#")
            echo "$w -> $(curl -s -o /dev/null -w '%{http_code}' "$V")"
          done
          for t in トビ ドバト ヒヨドリ カワウ; do
            echo "$t -> $(curl -s "https://ja.wikipedia.org/api/rest_v1/page/summary/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" $t)" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('type'),d.get('title'),bool(d.get('thumbnail')))")"
          done
