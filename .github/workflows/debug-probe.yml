name: debug-probe
on:
  push:
    branches: ['claude/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass variants
        continue-on-error: true
        run: |
          Q='[out:json][timeout:10];(nwr(around:200,35.64,139.55)["waterway"~"^(river|stream|canal)$"];nwr(around:200,35.64,139.55)["natural"="water"];way(around:200,35.64,139.55)["building"];);out tags qt 100;'
          t() { rm -f /tmp/o.txt /tmp/h.txt; echo "== $1"; shift; curl -s -m 12 -o /tmp/o.txt -w "status=%{http_code} time=%{time_total}\n" -D /tmp/h.txt "$@" || true; grep -i "^access-control" /tmp/h.txt || true; head -c 160 /tmp/o.txt 2>/dev/null | tr '\n' ' '; echo; }
          t "main POST plain" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter
          t "main POST +Origin" -H "Origin: https://uchi-stock.github.io" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter
          t "main GET" -G --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter
          t "main GET +UA" -A "bird-finder/1.0" -G --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter
          t "z.overpass" -A "bird-finder/1.0" -G --data-urlencode "data=$Q" https://z.overpass-api.de/api/interpreter
          t "osm.jp" -A "bird-finder/1.0" -G --data-urlencode "data=$Q" https://overpass.osm.jp/api/interpreter
          t "maps.mail.ru" -A "bird-finder/1.0" -G --data-urlencode "data=$Q" https://maps.mail.ru/osm/tools/overpass/api/interpreter
          t "kumi" -A "bird-finder/1.0" -G --data-urlencode "data=$Q" https://overpass.kumi.systems/api/interpreter
          t "coffee" -A "bird-finder/1.0" -G --data-urlencode "data=$Q" https://overpass.private.coffee/api/interpreter
