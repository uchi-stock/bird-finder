name: debug-probe
on:
  push:
    branches: ['claude/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Commons flight photo search
        continue-on-error: true
        run: |
          api() { curl -s -m 20 -G "https://commons.wikimedia.org/w/api.php" -A "bird-finder-probe/1.0" --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "origin=*" --data-urlencode "generator=search" --data-urlencode "gsrnamespace=6" --data-urlencode "gsrlimit=4" --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|extmetadata" --data-urlencode "iiurlwidth=500" --data-urlencode "gsrsearch=$1" ; }
          show() { python3 -c "
import sys,json
d=json.load(sys.stdin)
p=sorted(d.get('query',{}).get('pages',{}).values(), key=lambda x:x.get('index',99))
print('  n=%d'%len(p))
for x in p[:3]:
    ii=(x.get('imageinfo') or [{}])[0]
    em=ii.get('extmetadata',{})
    print('  ',x['title'][:70],'|',em.get('LicenseShortName',{}).get('value'),'|',(ii.get('thumburl') or '')[-40:])
"; }
          for sci in "Passer montanus" "Milvus migrans" "Phalacrocorax carbo" "Motacilla alba" "Hirundo rustica" "Pipistrellus abramus" "Corvus macrorhynchos"; do
            echo "== $sci"
            echo " A: incategory flying/in flight"; api "incategory:\"$sci\" (flying OR \"in flight\")" | show
            echo " B: text in flight"; api "\"$sci\" \"in flight\"" | show
          done
