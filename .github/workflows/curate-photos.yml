name: Curate photos (背景が単純な写真の選び直し)

# 鳥の写真を、背景が単純なものへ自動で選び直す。人の操作は要らない。
# - 月1回の定期実行と、鳥種データ（species.json）・この仕組み自体の変更時に動く（手動実行もできる）
# - 結果が変わったときだけ、PRとして出す。CIが通れば自動でマージされる
# - 安定させるため、選び直し済みの写真は、明らかに良い候補があるときだけ入れ替える（frontend/scripts/photoScore.jsのdecide）
# - 壊れた結果を出さないため、Commonsの検索に失敗した鳥が多いときは何も書かずに失敗する。photos.jsonの中身は、単体テスト（photosData.test.ts）で検査される
# - 結果は、実行のJob Summaryの表（今の画像と選んだ画像）で、あとから確認できる。気になれば、そのPRを戻せる
# 手動実行では、applyをfalseにすると、PRを出さずに、表の確認だけができる
on:
  schedule:
    - cron: "41 18 1 * *"
  push:
    branches:
      - main
    paths:
      - "frontend/src/data/species.json"
      # 仕組み自体を変えたとき（初回の導入を含む）にも、結果を作り直す
      - ".github/workflows/curate-photos.yml"
      - "frontend/scripts/photoScore.js"
      - "frontend/scripts/curatePhotos.js"
  workflow_dispatch:
    inputs:
      species_ids:
        description: "試す鳥のID（任意。カンマ区切り。例: sparrow,mallard）。空なら全種"
        required: false
        type: string
      apply:
        description: "true にすると、結果をPRとして出す。false は確認のみ"
        required: false
        type: boolean
        default: true

concurrency:
  group: curate-photos
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # 画像の読み取りにだけsharpを使う。依存には加えない（アプリや通常のCIに影響しない）
      - name: sharpをインストールする
        working-directory: frontend
        run: npm install --no-save sharp
      - name: 写真を選び直す
        working-directory: frontend
        env:
          SPECIES_IDS: ${{ inputs.species_ids }}
          REPORT: ${{ github.workspace }}/curate-report.md
        run: node scripts/curatePhotos.js
      - name: 結果をJob Summaryへ出す
        run: cat curate-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: curated-photos
          path: |
            frontend/src/data/photos.json
            curate-report.md
      - name: 結果をPRとして出す
        # 定期・鳥種データの変更時は常にPRを出す。手動実行は、applyの指定に従う
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        uses: ./dev-standards/.github/actions/commit-via-pr
        with:
          paths: frontend/src/data/photos.json
          commit-subject: "feat: 背景が単純な写真へ選び直す"
          commit-body: "背景の細かさで候補を比べ、今の画像より明らかに良いものだけを差し替えた（frontend/scripts/curatePhotos.js）。"
          pr-title: "feat: 背景が単純な写真へ選び直す"
          pr-body: "写真の選び直しの結果（自動）。今の画像と選んだ画像の表は、実行のJob Summaryで確認できる: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          branch-prefix: chore/curate-photos
          base-branch: main
          push-token: ${{ secrets.BOT_TOKEN }}
          github-token: ${{ secrets.BOT_TOKEN }}
