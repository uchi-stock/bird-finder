name: Curate photos (背景が単純な写真の選び直し)

# 鳥の写真を、背景が単純なものへ自動で選び直す。スマホのGitHub画面（Actions）から手動で実行する。
# 結果は、Job Summaryの表（今の画像と選んだ画像の並び）で確認できる。
# apply を true にすると、選んだ結果（frontend/src/data/photos.json）をPRとして出す。まず false で結果を確認する
on:
  workflow_dispatch:
    inputs:
      species_ids:
        description: "試す鳥のID（任意。カンマ区切り。例: sparrow,mallard）。空なら全種"
        required: false
        type: string
      apply:
        description: "true にすると、結果をPRとして出す。false は確認のみ"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # 画像の読み取りにだけsharpを使う。依存には加えない（アプリや通常のCIに影響しない）
      - name: sharpをインストールする
        working-directory: frontend
        run: npm install --no-save sharp
      - name: 写真を選び直す
        working-directory: frontend
        env:
          SPECIES_IDS: ${{ inputs.species_ids }}
          REPORT: ${{ github.workspace }}/curate-report.md
        run: node scripts/curatePhotos.js
      - name: 結果をJob Summaryへ出す
        run: cat curate-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: curated-photos
          path: |
            frontend/src/data/photos.json
            curate-report.md
      - name: 結果をPRとして出す
        if: inputs.apply
        uses: ./dev-standards/.github/actions/commit-via-pr
        with:
          paths: frontend/src/data/photos.json
          commit-subject: "feat: 背景が単純な写真へ選び直す"
          commit-body: "背景の細かさで候補を比べ、今の画像より明らかに良いものだけを差し替えた（frontend/scripts/curatePhotos.js）。"
          pr-title: "feat: 背景が単純な写真へ選び直す"
          pr-body: "写真の選び直しの結果。実行のJob Summaryの表（今の画像と選んだ画像）で確認できる。"
          branch-prefix: chore/curate-photos
          base-branch: main
          push-token: ${{ secrets.BOT_TOKEN }}
          github-token: ${{ secrets.BOT_TOKEN }}
