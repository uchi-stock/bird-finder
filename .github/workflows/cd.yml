name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # dev-standards（symlink共有のsw.js等の実体）を取得する
          submodules: true
      - id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.124.0
        with:
          working-directory: frontend
          artifact-path: frontend/dist
