name: "tmp survey calls alt (一時の鳴き声の再調査。確認後に削除する)"

# #223 の調査用。pushで動く（デフォルトブランチへのマージは不要）。確認後に、このファイルとsurveyCallsAlt.tsを削除する
on:
  push:
    branches:
      - claude/brave-goodall-y1e0n1
    paths:
      - ".github/workflows/tmp-survey-calls-alt.yml"
      - "frontend/scripts/surveyCallsAlt.ts"

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: 依存パッケージをインストールする
        working-directory: frontend
        run: npm ci
      - name: 別名で音源を探す
        working-directory: frontend
        env:
          REPORT: ${{ github.workspace }}/call-alt-report.md
        run: npx tsx scripts/surveyCallsAlt.ts
      - name: 結果をJob Summaryへ出す
        run: cat call-alt-report.md >> "$GITHUB_STEP_SUMMARY"
