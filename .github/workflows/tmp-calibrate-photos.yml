name: tmp-calibrate-photos

# 一時的な調査用workflow（issue #171、2026-11-19作成）。
# 1) 全種の今の画像の「写真か・動物か・獲物をくわえているか」の確度をログへ出す（しきい値を決める材料）
# 2) 指定した鳥の候補を、確度つきの一覧画像にして、調査用のブランチへ出す（目で選ぶ材料。artifactの取得先は、サンドボックスから届かない）
# 調査が終わったら、このファイルとスクリプトを削除する。
on:
  workflow_dispatch:
    inputs:
      species_ids:
        description: "候補を一覧にする鳥のID（カンマ区切り）"
        required: false
        default: "northern_goshawk,pipistrelle_bat,great_cormorant"
        type: string

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 依存パッケージをインストールする
        working-directory: frontend
        run: npm ci
      - name: sharpと画像分類のパッケージをインストールする
        working-directory: frontend
        run: npm install --no-save sharp @huggingface/transformers
      - name: 確度と一覧画像を作る
        working-directory: frontend
        env:
          OUT: ${{ github.workspace }}/calibration
          SPECIES_IDS: ${{ inputs.species_ids }}
        run: node scripts/tmpCalibratePhotos.js
      - name: 結果を調査用のブランチへ出す
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan calibration-output
          git rm -rf --cached . -q
          git add -f calibration
          git commit -q -m "調査用: 写真の質の判定の一覧（一時）"
          git push -f origin calibration-output
