name: tmp survey calls (一時: 鳴き声の調査。確認後に削除する)

# #223 の調査用。pushで動く（デフォルトブランチへのマージは不要）。確認後に、このファイルとsurveyCalls.tsを削除する
on:
  push:
    branches:
      - claude/brave-goodall-y1e0n1
    paths:
      - ".github/workflows/tmp-survey-calls.yml"
      - "frontend/scripts/surveyCalls.ts"

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: 依存パッケージをインストールする
        working-directory: frontend
        run: npm ci
      - name: 鳴き声の音源を調べる
        working-directory: frontend
        env:
          REPORT: ${{ github.workspace }}/call-report.md
        run: npx tsx scripts/surveyCalls.ts
      - name: 結果をJob Summaryへ出す
        run: cat call-report.md >> "$GITHUB_STEP_SUMMARY"
