name: tmp-pose-calibration

# 一時的な調査用workflow（issue #157、2026-11-19作成）。
# 全種の今の画像を、複数の問いの文で分類した飛ぶ確度つきの一覧画像（contact sheet）にして、artifactへ出す。
# サンドボックスからWikimediaへ届かないため、画像の目視確認のために使う。調査が終わったら、このファイルとスクリプトを削除する。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 依存パッケージをインストールする
        working-directory: frontend
        run: npm ci
      - name: sharpと画像分類のパッケージをインストールする
        working-directory: frontend
        run: npm install --no-save sharp @huggingface/transformers
      - name: 一覧画像を作る
        working-directory: frontend
        env:
          OUT: ${{ github.workspace }}/pose-calibration
        run: node scripts/tmpPoseCalibration.js
      - uses: actions/upload-artifact@v7
        with:
          name: pose-calibration
          path: pose-calibration
      # artifactの取得先（Azureのストレージ）は、サンドボックスから届かないため、結果を専用のブランチへも出す
      # （GitHubのAPIで読める）。このブランチは、調査が終わったら削除する
      - name: 結果を調査用のブランチへ出す
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan calibration-output
          git rm -rf --cached . -q
          git add -f pose-calibration
          git commit -q -m "調査用: 姿勢判定の一覧画像（一時）"
          git push -f origin calibration-output
