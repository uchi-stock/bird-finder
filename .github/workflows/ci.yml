name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    name: "CI"
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.124.0
    with:
      self_ref: v2.124.0
      packages: '[{"dir":"frontend","build":true,"node_version":"22","coverage_threshold":85},{"dir":"backend","node_version":"22","coverage_threshold":85}]'
      # dev-standardsのsymlink共有（sw.js等）の欠落・リンク切れを検知する
      enable_standards_check: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
