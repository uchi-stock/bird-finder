name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    name: "CI"
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.124.0
    with:
      self_ref: v2.124.0
      packages: '[{"dir":"frontend","build":true,"node_version":"22"}]'
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
