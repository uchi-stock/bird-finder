name: tmp-audio-list
# 一時調査用（#184）。調査が終わったら削除する
on:
  push:
    branches: [claude/brave-goodall-y1e0n1]
    paths: [".github/workflows/tmp-audio-list.yml"]
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 候補を一覧する
        run: |
          cat > /tmp/l.mjs <<'JS'
          const titles = ["File:Eurasian Wigeon (Anas penelope) (W1CDR0001386 BD2).ogg", "File:Hvizdak256.ogg"];
          for (const t of titles) {
            const p = new URLSearchParams({ action: "query", format: "json", titles: t, prop: "videoinfo", viprop: "url|mime|derivatives|extmetadata|duration" });
            const r = await fetch(`https://commons.wikimedia.org/w/api.php?${p}`, { headers: { "User-Agent": "bird-finder-audio-check/1.0" } });
            const pg = Object.values((await r.json()).query.pages)[0];
            const i = pg.videoinfo[0];
            const mp3 = i.derivatives?.find((d) => d.type?.startsWith("audio/mpeg"))?.src;
            console.log("RESULT " + JSON.stringify({ src: mp3, pageUrl: i.descriptionurl, title: pg.title.replace(/^File:/, ""), credit: (i.extmetadata?.Artist?.value ?? "").replace(/<[^>]*>/g, "").trim(), license: i.extmetadata?.LicenseShortName?.value, duration: i.duration }));
          }
          JS
          node /tmp/l.mjs
