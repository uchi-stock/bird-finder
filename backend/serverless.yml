# みんなが見つけた鳥の投稿・取得API（ログインなし）。API Gateway（HTTP API）+ Lambda + DynamoDB
service: bird-finder-api
frameworkVersion: '4'

custom:
  allowedOrigin: https://uchi-stock.github.io
  dailyLimit: 30

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  stage: ${opt:stage, 'prod'}
  memorySize: 128
  timeout: 10
  logRetentionInDays: 14
  httpApi:
    cors:
      allowedOrigins:
        - ${self:custom.allowedOrigin}
      allowedMethods: [GET, POST, OPTIONS]
      allowedHeaders: [Content-Type]
      maxAge: 3600
  environment:
    SIGHTINGS_TABLE: ${self:service}-${sls:stage}-sightings
    RATE_TABLE: ${self:service}-${sls:stage}-rate
    ALLOWED_ORIGIN: ${self:custom.allowedOrigin}
    DAILY_LIMIT: ${self:custom.dailyLimit}
    # アクセス元（IP）のハッシュに混ぜる秘密の値。デプロイのたびにCDが新しく作る（コードやログには残さない）
    RATE_PEPPER: ${env:RATE_PEPPER, 'local-dev-pepper'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [dynamodb:PutItem, dynamodb:Query]
          Resource: !GetAtt SightingsTable.Arn
        - Effect: Allow
          Action: [dynamodb:UpdateItem]
          Resource: !GetAtt RateLimitTable.Arn

package:
  patterns:
    - '!**'
    - 'src/**'
    - '!src/**/*.test.js'

functions:
  postSighting:
    handler: src/handlers/postSighting.handler
    # 暴走・悪用時の請求を抑えるため、同時実行数に上限を設ける
    reservedConcurrency: 5
    events:
      - httpApi:
          method: POST
          path: /sightings
  getSightings:
    handler: src/handlers/getSightings.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          method: GET
          path: /sightings

resources:
  # Serverlessが作るHTTP APIのステージに、既定の流量制限を加える（毎秒10件・瞬間20件。個人利用の規模に十分で、暴走時の請求を抑える）
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
  Resources:
    # 監視。通知先は作らない（GitHub Actionsの定期確認 ops-backend-health.yml が状態を見て、異常なら失敗させる）。
    # Lambdaのエラー数（5分で5件以上）
    PostSightingErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-postSighting-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${sls:stage}-postSighting
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    GetSightingsErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-getSightings-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${sls:stage}-getSightings
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    # APIの5xx（5分で5件以上）
    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-api-5xx
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value: !Ref HttpApi
          - Name: Stage
            Value: $default
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    # 見つけた鳥。区画（約5km四方）ごとに、新しい日付から取得する。期限なく保存する（TTLは無効）
    SightingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.SIGHTINGS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tile
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: tile
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        # 以前は90日で自動削除していた。永久保存にしたため、TTLを無効にする（項目を消したときの設定の残りを防ぐ）
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: false
    # 投稿回数の上限（アクセス元のハッシュ×日付）。TTLで25時間後に自動削除する
    RateLimitTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.RATE_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: idDate
            AttributeType: S
        KeySchema:
          - AttributeName: idDate
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
