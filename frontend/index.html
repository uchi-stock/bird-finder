    <meta name="theme-color" content="#2f7d4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="./manifest.webmanifest" />

    <title>とりのめ</title>
    <style>
      #initial-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fafaf7; color: #2f7d4f; }
      #initial-loading div { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(127, 127, 127, 0.3); border-top-color: currentColor; animation: initial-loading-spin 0.8s linear infinite; }
      @keyframes initial-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { #initial-loading { background: #161815; color: #4caf74; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-loading" aria-hidden="true"><div></div></div></div>
